name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "build-events.js"
      - "process-uploads.js"
      - "website/**"
      - "!website/admin.html"
      - "!website/js/admin.js"
  # Sent by the online admin after it has put photos/films in the R2 upload bucket
  repository_dispatch:
    types: [process-uploads]
  workflow_dispatch:

permissions:
  contents: write # to commit processed photos/films back to the repo
  pages: write
  id-token: write

# Queue runs instead of cancelling them — a cancelled run could have pushed processed
# photos without clearing them from R2, and they'd be added twice
concurrency:
  group: pages
  cancel-in-progress: false

env:
  R2_BUCKET: avec-anima-uploads
  R2_ENDPOINT: https://5427187c39e57d110ff67990e3d4bebf.r2.cloudflarestorage.com
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # R2 doesn't accept the newer default checksums the AWS CLI sends
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # ── Uploads from the online admin (see process-uploads.js) ─────────────
      - name: Fetch waiting uploads from R2
        id: uploads
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2 keys not set — skipping uploads"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws s3 sync "s3://$R2_BUCKET/jobs/" .uploads/jobs/ --endpoint-url "$R2_ENDPOINT" --only-show-errors
          if ls .uploads/jobs/*/job.json >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            ls .uploads/jobs
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No uploads waiting"
          fi
          if grep -qs '"aftermovie"' .uploads/jobs/*/job.json; then echo "film=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        if: steps.uploads.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install image tools
        if: steps.uploads.outputs.found == 'true'
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Install ffmpeg
        if: steps.uploads.outputs.film == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Process uploads
        if: steps.uploads.outputs.found == 'true'
        run: node process-uploads.js .uploads

      # Generated files (manifest, pages) are rebuilt after the rebase, so a clash
      # with an admin edit made while this ran resolves to a fresh, consistent build
      - name: Commit processed media
        if: steps.uploads.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          summary=$(node -e 'const fs=require("fs"),d=".uploads/results/";for(const f of fs.readdirSync(d)){const r=JSON.parse(fs.readFileSync(d+f));console.log(`- ${r.ok?"":"FAILED: "}${r.message}`)}')
          git commit -q -m "Add uploads from the online admin" -m "$summary"
          for attempt in 1 2 3; do
            git pull -q --rebase -X theirs origin main
            node build-events.js
            git add website
            git diff --cached --quiet || git commit -q -m "Rebuild pages after uploads"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Report results and clear processed uploads
        if: steps.uploads.outputs.found == 'true'
        run: |
          aws s3 cp .uploads/results/ "s3://$R2_BUCKET/results/" --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors
          while read -r id; do
            [ -n "$id" ] && aws s3 rm "s3://$R2_BUCKET/jobs/$id/" --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done < .uploads/processed.txt
          echo "Cleared: $(wc -l < .uploads/processed.txt) upload(s)"

      # ── Build + deploy ───────────────────────────────────────────────────
      # Regenerates manifest, event pages, sitemap.xml and llms.txt (no npm install needed)
      - name: Build event pages + SEO files
        run: node build-events.js

      - name: Build public site folder (exclude admin panel)
        run: |
          mkdir -p _site
          rsync -av --exclude 'admin.html' --exclude 'js/admin.js' website/ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
